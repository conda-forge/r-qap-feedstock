{% set version = "0.2-0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-qap
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/qap_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/qap/qap_{{ version }}.tar.gz
  sha256: f27ad71ad9c27790623d2e435fb1b58ecbacf79c0e6cea9131bc360dee9985a3

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ compiler('c') }}        # [not win]
    - {{ stdlib("c") }}          # [not win]
    - {{ compiler('fortran') }}  # [not win]
    - {{ compiler('m2w64_c') }}        # [win]
    - {{ stdlib("m2w64_c") }}          # [win]
    - {{ compiler('m2w64_fortran') }}        # [win]
    - {{ posix }}filesystem        # [win]
    - {{ posix }}make
    - {{ posix }}sed               # [win]
    - {{ posix }}coreutils         # [win]
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
  run:
    - r-base

test:
  commands:
    - $R -e "library('qap')"           # [not win]
    - "\"%R%\" -e \"library('qap')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=qap
  license: GPL-3.0-only
  summary: Implements heuristics for the Quadratic Assignment Problem (QAP). Currently only a simulated annealing heuristic is available.
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
